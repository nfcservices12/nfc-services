<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel — NFC Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1330;--ink2:#1c2247;--bg:#f3f5fc;--paper:#fff;--acc:#2337e0;--sun:#ffc83d;--mut:#5b6285;--line:#dfe3f3;--ok:#1d8a4e;--warn:#b7791f;--bad:#c53030;--r:14px}
*{box-sizing:border-box;margin:0}
h1,h2,.brand,.kpi .v,.authbox h1{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#aab1d6}.btn:disabled{opacity:.55;cursor:wait}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}.btn.danger{color:var(--bad)}
input,select,textarea{font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
input[type=checkbox]{width:auto}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
label.chk{display:flex;align-items:center;gap:8px}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.authbox{background:var(--paper);border-radius:20px;padding:30px;width:100%;max-width:400px;display:grid;gap:14px}
.authbox h1{font-size:24px;letter-spacing:-.03em}.authbox h1 span{color:var(--acc)}
.authbox .links{display:flex;justify-content:space-between;font-size:13px}
.authbox a{color:var(--acc);cursor:pointer}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:#fdeeea;color:#8f2415}
.note.ok{background:#e8f6ee;color:#145c36}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--ink);color:#e6e9fb;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
aside .brand{font-weight:800;font-size:18px;letter-spacing:-.02em;padding:4px 10px 16px}aside .brand span{color:var(--sun)}
aside .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a91bd;padding:14px 10px 6px}
aside a{display:block;padding:9px 10px;border-radius:9px;color:#d5daf5;text-decoration:none;font-weight:500;font-size:14px}
aside a:hover{background:#1c2247}aside a.on{background:var(--sun);color:var(--ink);font-weight:700}
aside .me{margin-top:auto;padding:14px 10px 0;font-size:13px;color:#a3a9d1;border-top:1px solid #262c52}
#app>div{min-width:0}
main{padding:26px;min-width:0}
.top{display:none}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:.2s}aside.open{transform:none}
 .top{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;font-weight:700}main{padding:16px}}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:26px;letter-spacing:-.03em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools input,.tools select{width:auto;min-width:150px;flex:1 1 150px}
@media(max-width:560px){.head .tools{width:100%}.dl{grid-template-columns:1fr!important;gap:0 0}.dl dd{margin:0 0 8px}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
h2{font-size:16px;margin-bottom:12px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #eef0f9;vertical-align:middle}
tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover{background:#f6f7fd}
td.act{white-space:nowrap;text-align:right}
.empty{padding:34px;text-align:center;color:var(--mut)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e9ecf8;color:var(--ink2);white-space:nowrap}
.pill.g{background:#e3f4ea;color:#156a3c}.pill.y{background:#fdf3d7;color:#8a5a00}.pill.r{background:#fde5e1;color:#a52a1a}.pill.b{background:#e4edfb;color:#1d4f9c}
.board{display:flex;gap:12px;overflow:auto;padding-bottom:10px;align-items:flex-start}
.lane{min-width:250px;width:250px;background:#e6eaf8;border-radius:var(--r);padding:10px;flex-shrink:0}
.lane h3{font-size:13px;display:flex;justify-content:space-between;padding:4px 4px 10px}
.tk{background:var(--paper);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;display:grid;gap:6px;font-size:14px}
.tk small{color:var(--mut)}.tk select{padding:6px 8px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(14,19,48,.6);z-index:60;display:grid;place-items:center;padding:14px;overflow:auto}
.mbox{background:var(--paper);border-radius:18px;padding:22px;width:100%;max-width:620px;max-height:92vh;overflow:auto;display:grid;gap:14px}
.mbox h2{font-size:20px;margin:0}.mbox form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;max-width:90vw}
#toast.err{background:var(--bad)}
.hist{display:grid;gap:8px}.hist div{padding:10px 12px;background:#f3f5fc;border-radius:10px;font-size:14px}.hist small{color:var(--mut);display:block}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}.dl dt{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.bars .b i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--acc);min-height:2px}.bars .b i.e{background:#c3c9e6}
.bars .pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%}
.loading{padding:40px;text-align:center;color:var(--mut)}
img.th{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--line)}
</style>
</head>
<body>
<div id="auth"><div class="authbox">
  <h1>NFC <span>Services</span></h1>
  <div id="authTitle" style="font-weight:600">Entrar no painel</div>
  <form id="authForm" style="display:grid;gap:12px">
    <label id="fName" hidden>Nome<input name="full_name" maxlength="120"></label>
    <label id="fEmail">E-mail<input name="email" type="email" required autocomplete="email"></label>
    <label id="fPass">Senha<input name="password" type="password" minlength="8" autocomplete="current-password"></label>
    <button class="btn p" id="authBtn">Entrar</button>
  </form>
  <div id="authMsg" class="note" hidden></div>
  <div class="links"><a data-mode="forgot">Esqueci a senha</a><a data-mode="login" hidden>Voltar ao login</a></div>
</div></div>

<div id="app" hidden>
  <aside id="side"></aside>
  <div><div class="top"><button class="btn sm" id="menuBtn">☰</button><span>NFC Services</span></div><main id="view"></main></div>
</div>
<div id="modal" hidden></div><div id="toast" hidden></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient("https://mlsgcvsxaxznbxisyqut.supabase.co", "sb_publishable_jXlSZf1lHatkf5y81tlfRQ_thgs_mCf");
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fdate = (d) => (d ? new Date(String(d).length <= 10 ? d + "T12:00:00" : d).toLocaleDateString("pt-BR") : "—");
const today = () => new Date().toLocaleDateString("sv-SE");
const ym = (d) => String(d).slice(0, 7);
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "");
let me = null, recovering = false;
const isMgr = () => ["admin", "manager"].includes(me?.role), isAdmin = () => me?.role === "admin";

function toast(t, err) { const el = $("#toast"); el.textContent = t; el.className = err ? "err" : ""; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), err ? 5000 : 2600); }
const ERR = { "23503": "Não é possível excluir: existem registros vinculados.", "23505": "Já existe um registro com esse valor.", "42501": "Você não tem permissão para esta ação.", "23514": "Algum campo está com valor inválido." };
async function run(p) { const { data, error } = await p; if (error) { const m = ERR[error.code] || error.message || "Erro inesperado."; toast(m, true); throw error; } return data; }
function modal(html) { const m = $("#modal"); m.innerHTML = `<div class="mbox">${html}</div>`; m.hidden = false; return m.firstElementChild; }
function closeModal() { $("#modal").hidden = true; $("#modal").innerHTML = ""; }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal" || e.target.dataset.close != null) closeModal(); });
function confirmBox(text, okLabel = "Excluir") { return new Promise((res) => { const b = modal(`<h2>Confirmar</h2><p>${esc(text)}</p><div class="mfoot"><button class="btn" id="cNo">Cancelar</button><button class="btn d" id="cYes">${esc(okLabel)}</button></div>`); $("#cNo", b).onclick = () => { closeModal(); res(false); }; $("#cYes", b).onclick = () => { closeModal(); res(true); }; }); }

/* ---------- rótulos ---------- */
const L = {
  lead: { novo: "Novo contato", primeiro_atendimento: "Primeiro atendimento", negociacao: "Em negociação", orcamento_enviado: "Orçamento enviado", aguardando_aprovacao: "Aguardando aprovação", fechado: "Fechado", perdido: "Perdido" },
  project: { aguardando_inicio: "Aguardando início", em_desenvolvimento: "Em desenvolvimento", em_revisao: "Em revisão", aguardando_cliente: "Aguardando cliente", concluido: "Concluído", suspenso: "Suspenso" },

};
const COLOR = { fechado: "g", concluido: "g", concluida: "g", aprovado: "g", ativa: "g", ativo: "g", em_dia: "g", perdido: "r", recusado: "r", atrasado: "r", cancelada: "r", suspenso: "r", pendente: "y", aberta: "y", enviado: "b", orcamento_enviado: "b", em_desenvolvimento: "b", em_andamento: "b", novo: "y" };
const pill = (map, v) => `<span class="pill ${COLOR[v] || ""}">${esc(map[v] || v || "—")}</span>`;
const opts = (map) => Object.entries(map);
const yes = (v) => (v ? '<span class="pill g">Publicado</span>' : '<span class="pill">Oculto</span>');

/* ---------- módulos genéricos ---------- */
const pubFields = [{ k: "published", l: "Publicado no site", t: "check" }, { k: "sort", l: "Ordem", t: "number", d: 0 }];
const MOD = {
  services: { title: "Serviços", table: "services", sel: "*, service_categories(name)", order: "sort", mgr: true, search: ["name"],
    cols: [["Serviço", (r) => `<b>${esc(r.name)}</b>`], ["Categoria", (r) => esc(r.service_categories?.name || "—")], ["Preço", (r) => (r.price != null ? brl(r.price) : "—")], ["Cobrança", (r) => esc(L.bill[r.billing_model])], ["Site", (r) => yes(r.published)]],
    fields: [{ k: "name", l: "Nome", req: true }, { k: "category_id", l: "Categoria", t: "ref", ref: "service_categories" }, { k: "description", l: "Descrição", t: "area" }, { k: "image_url", l: "Imagem", t: "image" },
      { k: "price", l: "Preço (opcional)", t: "money" }, { k: "billing_model", l: "Modelo de cobrança", t: "select", o: opts(L.bill), d: "sob_consulta" }, { k: "estimated_time", l: "Prazo estimado" }, { k: "benefits", l: "Benefícios (um por linha)", t: "lines" }, ...pubFields] },
  categories: { title: "Categorias de serviço", table: "service_categories", order: "sort", mgr: true, search: ["name"], cols: [["Categoria", (r) => esc(r.name)], ["Ordem", (r) => r.sort]], fields: [{ k: "name", l: "Nome", req: true }, { k: "sort", l: "Ordem", t: "number", d: 0 }] },
  portfolio: { title: "Portfólio", table: "portfolio_items", order: "sort", mgr: true, search: ["title"],
    cols: [["", (r) => (safeUrl(r.image_url) ? `<img class="th" src="${esc(r.image_url)}" alt="">` : "")], ["Projeto", (r) => `<b>${esc(r.title)}</b>`], ["Categoria", (r) => esc(r.category || "—")], ["Site", (r) => yes(r.published)]],
    fields: [{ k: "title", l: "Título", req: true }, { k: "description", l: "Descrição", t: "area" }, { k: "category", l: "Categoria" }, { k: "image_url", l: "Imagem", t: "image" }, { k: "link", l: "Link do projeto", t: "url" }, ...pubFields] },
  testimonials: { title: "Depoimentos", table: "testimonials", order: "sort", mgr: true, search: ["author"], cols: [["Autor", (r) => `<b>${esc(r.author)}</b>`], ["Empresa", (r) => esc(r.company || "—")], ["Depoimento", (r) => esc((r.content || "").slice(0, 80))], ["Site", (r) => yes(r.published)]],
    fields: [{ k: "author", l: "Nome do cliente", req: true }, { k: "company", l: "Empresa" }, { k: "content", l: "Depoimento", t: "area", req: true }, ...pubFields] },
  faqs: { title: "Perguntas frequentes", table: "faqs", order: "sort", mgr: true, search: ["question"], cols: [["Pergunta", (r) => `<b>${esc(r.question)}</b>`], ["Site", (r) => yes(r.published)]], fields: [{ k: "question", l: "Pergunta", req: true }, { k: "answer", l: "Resposta", t: "area", req: true }, ...pubFields] },
  banners: { title: "Banner principal", table: "banners", order: "sort", mgr: true, search: ["title"], cols: [["Título", (r) => `<b>${esc(r.title)}</b>`], ["Subtítulo", (r) => esc(r.subtitle || "—")], ["Site", (r) => yes(r.published)]],
    fields: [{ k: "title", l: "Título (substitui a frase principal do site)", req: true }, { k: "subtitle", l: "Subtítulo", t: "area" }, ...pubFields] },
  clients: { title: "Clientes", table: "clients", order: "name", mgr: true, search: ["name", "contact_name", "email", "phone"], filter: { k: "status", map: L.client }, rowLink: (r) => `#/clients/${r.id}`,

    fields: [{ k: "name", l: "Nome ou razão social", req: true }, { k: "contact_name", l: "Responsável" }, { k: "email", l: "E-mail", t: "email" }, { k: "phone", l: "Telefone" }, { k: "whatsapp", l: "WhatsApp" }, { k: "document", l: "CPF/CNPJ (opcional)" }, { k: "address", l: "Endereço (opcional)" },

    cols: [["Cliente", (r) => `<b>${esc(r.clients?.name)}</b>`], ["Serviço", (r) => esc(r.services?.name || r.description || "—")], ["Mensal", (r) => brl(r.monthly_value)], ["Próx. cobrança", (r) => fdate(r.next_billing)], ["Pagamento", (r) => pill(L.pay, r.payment_status)], ["Status", (r) => pill(L.sub, r.status)]],
    fields: [{ k: "client_id", l: "Cliente", t: "ref", ref: "clients", req: true }, { k: "service_id", l: "Serviço", t: "ref", ref: "services" }, { k: "description", l: "Descrição" }, { k: "monthly_value", l: "Valor mensal", t: "money", req: true }, { k: "start_date", l: "Início", t: "date", d: today },
      { k: "next_billing", l: "Próxima cobrança", t: "date" }, { k: "payment_status", l: "Situação do pagamento", t: "select", o: opts(L.pay), d: "em_dia" }, { k: "status", l: "Status", t: "select", o: opts(L.sub), d: "ativa" }],
    after: async (row, old) => { await sb.from("subscription_events").insert({ subscription_id: row.id, description: old ? `Assinatura alterada: ${brl(row.monthly_value)}/mês, ${L.sub[row.status]}, pagamento ${L.pay[row.payment_status]}` : `Assinatura criada: ${brl(row.monthly_value)}/mês` }); } },
  maintenance: { title: "Manutenções", table: "maintenance_requests", sel: "*, clients(name)", order: "created_at", desc: true, filter: { k: "status", map: L.mstatus },
    cols: [["Cliente", (r) => `<b>${esc(r.clients?.name)}</b>`], ["Tipo", (r) => esc(L.mkind[r.kind])], ["Solicitação", (r) => esc((r.description || "").slice(0, 70))], ["Aberta em", (r) => fdate(r.created_at)], ["Status", (r) => pill(L.mstatus, r.status)]],
    fields: [{ k: "client_id", l: "Cliente", t: "ref", ref: "clients", req: true }, { k: "kind", l: "Tipo", t: "select", o: opts(L.mkind), d: "atualizacao" }, { k: "description", l: "O que foi solicitado / realizado", t: "area", req: true }, { k: "status", l: "Status", t: "select", o: opts(L.mstatus), d: "aberta" }],

const refCache = {};

async function fieldHtml(f, row) {
  const v = row?.[f.k] ?? (typeof f.d === "function" ? f.d() : f.d) ?? "", req = f.req ? "required" : "", n = `name="${f.k}"`;
  if (f.t === "check") return `<label class="chk"><input type="checkbox" ${n} ${v ? "checked" : ""}> ${esc(f.l)}</label>`;
  let inp;
  if (f.t === "area") inp = `<textarea ${n} rows="3" ${req}>${esc(v)}</textarea>`;
  else if (f.t === "lines") inp = `<textarea ${n} rows="4">${esc((v || []).join("\n"))}</textarea>`;
  else if (f.t === "items") inp = `<textarea ${n} rows="4" ${req} placeholder="Site institucional | 1500">${esc((v || []).map((i) => `${i.d} | ${i.v}`).join("\n"))}</textarea>`;
  else if (f.t === "select") inp = `<select ${n}>${f.o.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  else if (f.t === "ref") { const list = await refs(f.ref, f.label); inp = `<select ${n} ${req}><option value="">—</option>${list.map((o) => `<option value="${esc(o.id)}" ${o.id === v ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`; }
  else if (f.t === "image") inp = `<input type="hidden" ${n} value="${esc(v)}"><input type="file" accept="image/*" data-up="${f.k}">${safeUrl(v) ? `<img class="th" src="${esc(v)}" alt="">` : ""}`;

}
function readForm(fields, form) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.k]; if (!el) continue; let v = f.t === "check" ? el.checked : el.value.trim();
    if (f.t === "lines") v = v.split("\n").map((s) => s.trim()).filter(Boolean);
    else if (f.t === "items") { v = v.split("\n").map((s) => s.trim()).filter(Boolean).map((s) => { const i = s.lastIndexOf("|"); const val = i < 0 ? NaN : Number(s.slice(i + 1).trim().replace(/\./g, "").replace(",", ".")); return { d: (i < 0 ? s : s.slice(0, i)).trim(), v: val }; }); if (v.some((i) => !i.d || !isFinite(i.v) || i.v < 0)) throw new Error("Itens: use o formato “descrição | valor” em cada linha."); }
    else if (f.t === "money" || f.t === "number") v = v === "" ? (f.t === "number" ? 0 : null) : Number(v);
    else if (f.t !== "check" && v === "") v = null;

}
async function openForm(key, row, preset = {}, done) {

}

function months(n) { const out = [], d = new Date(); d.setDate(1); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push({ k: x.toLocaleDateString("sv-SE").slice(0, 7), l: x.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "") }); } return out; }

const kpi = (l, v, s = "") => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`;
async function dashboard() {
  loading(); const cm = today().slice(0, 7);
  const projects = await run(sb.from("projects").select("id,status,service_id,services(name),due_date,name,clients(name)"));
  const active = projects.filter((p) => ["em_desenvolvimento", "em_revisao", "aguardando_cliente"].includes(p.status));
  let html = `<div class="head"><h1>Visão geral</h1></div>`;
  if (!isMgr()) { view().innerHTML = html + `<div class="kpis">${kpi("Projetos em andamento", active.length)}${kpi("Projetos concluídos", projects.filter((p) => p.status === "concluido").length)}</div><div class="card"><h2>Projetos em andamento</h2>${tableHtml([["Projeto", (r) => esc(r.name)], ["Cliente", (r) => esc(r.clients?.name)], ["Prazo", (r) => fdate(r.due_date)]], active)}</div>`; return; }
  const [clients, leads, quotes, subs, tx] = await Promise.all([
    run(sb.from("clients").select("id,created_at")), run(sb.from("leads").select("id,status,created_at")), run(sb.from("quotes").select("id,status")),
    run(sb.from("subscriptions").select("id,status,monthly_value,service_id,services(name)")), run(sb.from("transactions").select("kind,amount,due_date,paid_at")),
  ]);
  const inc = tx.filter((t) => t.kind === "receita"), ms = months(6), rev = {}, cli = {};
  inc.filter((t) => t.paid_at).forEach((t) => (rev[ym(t.paid_at)] = (rev[ym(t.paid_at)] || 0) + Number(t.amount)));
  clients.forEach((c) => (cli[ym(c.created_at)] = (cli[ym(c.created_at)] || 0) + 1));
  const act = subs.filter((s) => s.status === "ativa"), top = {};
  [...projects, ...subs].forEach((x) => x.services?.name && (top[x.services.name] = (top[x.services.name] || 0) + 1));
  const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  html += `<div class="kpis">
    ${kpi("Clientes", clients.length)}${kpi("Novos leads", leads.filter((l) => l.status === "novo").length, "aguardando atendimento")}
    ${kpi("Orçamentos pendentes", quotes.filter((q) => q.status === "enviado").length)}${kpi("Projetos em andamento", active.length)}
    ${kpi("Projetos concluídos", projects.filter((p) => p.status === "concluido").length)}${kpi("Receita do mês", brl(rev[cm] || 0), "recebida")}
    ${kpi("Valores pendentes", brl(inc.filter((t) => !t.paid_at).reduce((s, t) => s + Number(t.amount), 0)), "a receber")}
    ${kpi("Assinaturas ativas", act.length, brl(act.reduce((s, x) => s + Number(x.monthly_value), 0)) + " por mês")}</div>
  <div class="cols"><div class="card"><h2>Receita recebida por mês</h2>${inc.some((t) => t.paid_at) ? bars(ms, [{ n: "Receita", v: rev, fmt: brl }]) : '<div class="empty">Sem pagamentos registrados ainda.</div>'}</div>

  <div class="card"><h2>Serviços mais contratados</h2>${topList.length ? tableHtml([["Serviço", (r) => esc(r[0])], ["Contratações", (r) => r[1]]], topList) : '<div class="empty">Aparece aqui quando houver projetos ou assinaturas vinculados a serviços.</div>'}</div>`;
  view().innerHTML = html;

async function projectDetail(p) {

  const draw = () => { $("#steps", b).innerHTML = steps.map((s, i) => `<label class="chk"><input type="checkbox" data-i="${i}" ${s.done ? "checked" : ""}> ${esc(s.t)}</label>`).join("") || '<small style="color:var(--mut)">Nenhuma etapa.</small>'; $$("#steps input", b).forEach((c) => (c.onchange = () => { steps[c.dataset.i].done = c.checked; save(); })); };
  draw();
  $("#addStep", b).onclick = () => { const t = $("#newStep", b).value.trim(); if (!t) return; steps = [...steps, { t, done: false }]; $("#newStep", b).value = ""; save(); };

}

/* ---------- financeiro ---------- */
let finMonth = today().slice(0, 7);
async function financeView() {
  loading(); const all = await run(sb.from("transactions").select(MOD.transactions.sel).order("due_date", { ascending: false }));
  const inM = (d) => d && ym(d) === finMonth, sum = (a) => a.reduce((s, t) => s + Number(t.amount), 0), R = all.filter((t) => t.kind === "receita"), D = all.filter((t) => t.kind === "despesa");
  const rec = sum(R.filter((t) => inM(t.paid_at))), prev = sum(R.filter((t) => !t.paid_at && inM(t.due_date))), desp = sum(D.filter((t) => inM(t.paid_at))), dprev = sum(D.filter((t) => !t.paid_at && inM(t.due_date)));
  const ms = months(6), vin = {}, vout = {}; R.filter((t) => t.paid_at).forEach((t) => (vin[ym(t.paid_at)] = (vin[ym(t.paid_at)] || 0) + Number(t.amount))); D.filter((t) => t.paid_at).forEach((t) => (vout[ym(t.paid_at)] = (vout[ym(t.paid_at)] || 0) + Number(t.amount)));
  const rows = all.filter((t) => inM(t.due_date) || inM(t.paid_at));
  view().innerHTML = `<div class="head"><h1>Financeiro</h1><div class="tools"><input type="month" id="mon" value="${finMonth}"><button class="btn p" id="add">+ Lançamento</button></div></div>
  <div class="kpis">${kpi("Receita recebida", brl(rec), "no mês")}${kpi("Receita prevista", brl(prev), "ainda não recebida")}${kpi("Despesas pagas", brl(desp), "no mês")}${kpi("Despesas previstas", brl(dprev))}${kpi("Saldo do mês", brl(rec - desp), "recebido − pago")}</div>
  <div class="card" style="margin-bottom:14px"><h2>Fluxo de caixa — últimos 6 meses (azul: entradas · cinza: saídas)</h2>${all.some((t) => t.paid_at) ? bars(ms, [{ n: "Entradas", v: vin, fmt: brl }, { n: "Saídas", v: vout, fmt: brl, c: "e" }]) : '<div class="empty">Sem pagamentos registrados ainda.</div>'}</div><div id="list"></div>`;
  $("#list").innerHTML = tableHtml([["Data", (r) => fdate(r.paid_at || r.due_date)], ["Descrição", (r) => `<b>${esc(r.description)}</b>`], ["Cliente", (r) => esc(r.clients?.name || "—")], ["Tipo", (r) => esc(L.tkind[r.kind])], ["Valor", (r) => brl(r.amount)], ["Situação", (r) => (r.paid_at ? '<span class="pill g">Pago</span>' : '<span class="pill y">Previsto</span>')]], rows,
    { html: (r) => `${r.paid_at ? "" : '<button class="btn sm" data-a="pay">Marcar pago</button> '}<button class="btn sm" data-a="edit">Editar</button> <button class="btn sm danger" data-a="del">Excluir</button>` });
  $("#mon").onchange = (e) => { if (e.target.value) { finMonth = e.target.value; financeView(); } };
  $("#add").onclick = () => openForm("transactions");
  $$("#list tr[data-i]").forEach((tr) => (tr.onclick = async (e) => { const r = rows[tr.dataset.i], a = e.target.dataset.a; if (a === "edit") openForm("transactions", r); else if (a === "del") removeRow("transactions", r); else if (a === "pay") { await run(sb.from("transactions").update({ paid_at: today() }).eq("id", r.id)); toast("Marcado como pago."); financeView(); } }));

/* ---------- rotas ---------- */
const NAV = [["", "Geral"], ["dashboard", "Visão geral", "all"], ["", "Comercial", "mgr"], ["leads", "Leads", "mgr"], ["quotes", "Orçamentos", "mgr"], ["clients", "Clientes", "all"], ["", "Operação"], ["projects", "Projetos", "all"], ["subscriptions", "Assinaturas", "mgr"], ["maintenance", "Manutenções", "all"], ["", "Financeiro", "mgr"], ["finance", "Financeiro", "mgr"],
  ["", "Site", "mgr"], ["services", "Serviços", "mgr"], ["categories", "Categorias", "mgr"], ["portfolio", "Portfólio", "mgr"], ["testimonials", "Depoimentos", "mgr"], ["faqs", "Perguntas frequentes", "mgr"], ["banners", "Banner", "mgr"], ["", "Sistema", "admin"], ["settings", "Configurações", "admin"], ["users", "Usuários", "admin"]];
const allowed = (lvl) => !lvl || lvl === "all" || (lvl === "mgr" && isMgr()) || (lvl === "admin" && isAdmin());

function drawNav(cur) { $("#side").innerHTML = `<div class="brand">NFC <span>Services</span></div>` + NAV.filter((n) => allowed(n[2])).map(([k, l]) => (k ? `<a href="#/${k}" class="${k === cur ? "on" : ""}">${esc(l)}</a>` : `<div class="grp">${esc(l)}</div>`)).join("") + `<div class="me">${esc(me.full_name || me.email)}<br>${esc(L.role[me.role])}<br><a href="index.html" target="_blank">Ver site</a><a href="#" id="out">Sair</a></div>`; $("#out").onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); }; }

/* ---------- autenticação ---------- */
let mode = "login", pendingMsg = "";
const authMsg = (t, ok) => { const el = $("#authMsg"); el.textContent = t; el.className = "note" + (ok ? " ok" : ""); el.hidden = !t; };
function setMode(m) {
  mode = m; authMsg("");
  $("#authTitle").textContent = { login: "Entrar no painel", signup: "Criar conta", forgot: "Recuperar senha", reset: "Definir nova senha" }[m];
  $("#authBtn").textContent = { login: "Entrar", signup: "Criar conta", forgot: "Enviar link", reset: "Salvar nova senha" }[m];
  $("#fName").hidden = m !== "signup"; $("#fEmail").hidden = m === "reset"; $("#fPass").hidden = m === "forgot";
  $$(".links a").forEach((a) => (a.hidden = m === "reset" || a.dataset.mode === m || (m === "login" && a.dataset.mode === "login")));
}
$$(".links a").forEach((a) => (a.onclick = () => setMode(a.dataset.mode)));
$("#authForm").onsubmit = async (e) => {
  e.preventDefault(); const f = e.target.elements, btn = $("#authBtn"), email = f.email.value.trim(), password = f.password.value, here = location.origin + location.pathname;
  if (mode !== "forgot" && password.length < 8) return authMsg("A senha precisa ter pelo menos 8 caracteres.");
  btn.disabled = true; let r;
  if (mode === "login") r = await sb.auth.signInWithPassword({ email, password });
  else if (mode === "signup") r = await sb.auth.signUp({ email, password, options: { data: { full_name: f.full_name.value.trim() }, emailRedirectTo: here } });
  else if (mode === "forgot") r = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
  else r = await sb.auth.updateUser({ password });
  btn.disabled = false;
  if (r.error) return authMsg({ "Invalid login credentials": "E-mail ou senha incorretos.", "Email not confirmed": "Confirme seu e-mail pelo link que enviamos antes de entrar." }[r.error.message] || r.error.message);
  if (mode === "signup" && !r.data.session) authMsg("Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.", true);
  else if (mode === "forgot") authMsg("Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.", true);
  else if (mode === "reset") { recovering = false; toast("Senha alterada."); start((await sb.auth.getSession()).data.session); }
};
async function start(session) {
  if (recovering) return;
  if (!session) { me = null; $("#app").hidden = true; $("#auth").hidden = false; setMode("login"); if (pendingMsg) { authMsg(pendingMsg); pendingMsg = ""; } return; }
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (!data || !data.active) { me = null; $("#app").hidden = true; $("#auth").hidden = false; pendingMsg = "Sua conta ainda não foi liberada por um administrador."; await sb.auth.signOut(); return; }
  me = data; $("#auth").hidden = true; $("#app").hidden = false; route();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { recovering = true; $("#app").hidden = true; $("#auth").hidden = false; setMode("reset"); return; }
  if (ev === "SIGNED_OUT") return start(null);
  if (ev === "INITIAL_SESSION" || (ev === "SIGNED_IN" && !me)) setTimeout(() => start(session), 0);
});
</script>
